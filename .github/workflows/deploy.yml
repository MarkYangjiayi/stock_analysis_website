name: Build and Deploy

on:
  push:
    branches:
      - main # 如果你的主分支叫 master，请改成 master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Test backend and quant engine
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Images (利用 GitHub 的 7GB 内存狂飙)
        run: |
          docker build -t quantify-backend:latest .
          docker build --build-arg NEXT_PUBLIC_API_URL=https://finbrain.icu -t quantify-frontend:latest ./frontend
          docker save quantify-backend:latest quantify-frontend:latest | gzip > images.tar.gz

      - name: Transfer Images to Aliyun (自动空投)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "images.tar.gz,docker-compose.yml"
          target: "/home/admin/stock_analysis_website"

      - name: Deploy on Aliyun (自动换弹重启)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -eu
            cd /home/admin/stock_analysis_website
            sudo docker load -i images.tar.gz
            if ! sudo docker compose up -d --remove-orphans; then
              sudo docker compose ps
              sudo docker compose logs --tail=200 backend worker frontend
              exit 1
            fi
            attempt=0
            until curl -fsS http://127.0.0.1:8000/health/ready > /dev/null \
              && curl -fsS http://127.0.0.1:3000/ > /dev/null; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 60 ]; then
                sudo docker compose ps
                sudo docker compose logs --tail=200 backend worker frontend
                exit 1
              fi
              sleep 3
            done
            sudo docker image prune -f
            rm -f images.tar.gz # 打扫战场，释放磁盘空间
