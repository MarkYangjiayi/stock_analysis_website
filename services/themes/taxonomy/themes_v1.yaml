# Curated seed taxonomy for the trending-themes feature.
#
# Git is the only source of truth: the worker syncs this file into the
# `themes` table, and new themes enter only through an owner-approved
# proposal that is pasted back here. Membership is generated by the worker
# from proxy-ETF holdings, description keywords and the seeds below, then
# verified by DeepSeek against a verbatim quote from the company description.
#
# Field reference
#   slug               stable identifier (lowercase, hyphenated)
#   name_en / name_zh  display names (UI copy is English, reports are Chinese)
#   megatrend          coarse parent group used for grouping in the UI
#   definition         1-3 sentences for the LLM verifier: what is in / out
#   keywords           description phrases; a candidate needs >= 2 distinct hits
#   negative_keywords  any hit vetoes the keyword channel for that company
#   proxy_etfs         US-listed thematic ETFs (prices for the proxy line, holdings
#                      for membership candidates); first one is the primary proxy
#   seed_core          hand-picked pure plays, always candidates (US tickers)
#   pins / bans        owner overrides: force core / always exclude
#   status             active | watch | retired
version: themes-v1
themes:
  - slug: ai-compute
    name_en: AI Compute & Accelerators
    name_zh: AI 算力芯片
    megatrend: ai-infrastructure
    definition: >-
      Designers and suppliers of processors and custom silicon used to train
      or run AI models in data centers (GPUs, AI accelerators, AI ASICs and
      their key IP). Excludes general consumer electronics makers.
    keywords: [graphics processing unit, gpu, accelerator, accelerated computing,
      artificial intelligence, data center, asic, custom silicon, semiconductor,
      high-performance computing, inference, ai chip]
    negative_keywords: [video game retailer, restaurant]
    proxy_etfs: [SMH, SOXX, AIQ]
    seed_core: [NVDA, AMD, AVGO, MRVL, ARM]
    pins: []
    bans: []
    status: active

